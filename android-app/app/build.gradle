plugins {
    id 'com.android.application'
}

android {
    namespace 'com.falconplus.emp'
    compileSdk 36

    defaultConfig {
        applicationId "com.falconplus.emp"
        minSdk 21          // Android 5.0+ — covers virtually every phone in use
        targetSdk 36
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            storeFile file("../falcon-release.keystore")
            storePassword "falconplus2026"
            keyAlias "falconplus"
            keyPassword "falconplus2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Aligns the kotlin-stdlib versions pulled in by the two androidx libs
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
